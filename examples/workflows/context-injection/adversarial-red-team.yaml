# ──────────────────────────────────────────────────────────────────────────────
# Pattern: ADVERSARIAL RED TEAM
# ──────────────────────────────────────────────────────────────────────────────
# Problem: Your documentation/code agent produced output. How do you know it's
#          not hallucinated garbage? Regular review catches obvious errors but
#          misses subtle fabrications.
#
# Solution: Spawn adversarial agents whose SOLE JOB is to break/disprove the
#           output. Give them synthetic history that makes them adversarial:
#           "You've caught this agent lying before and you don't trust it."
#
# The key insight: LLMs are people-pleasers. A "reviewer" will say "looks good!"
# unless you actively make it adversarial. Seeding adversarial history makes
# the agent genuinely try to find problems rather than rubber-stamp.
# ──────────────────────────────────────────────────────────────────────────────
name: adversarial-red-team-pattern
description: Adversarial agents that actively try to disprove/break outputs

trigger:
  type: manual

params:
  document_to_verify:
    type: string
    required: true
    description: "The content to red-team (from a prior agent)"
  source_code_path:
    type: string
    description: "Codebase for verification"

agents:
  # ── The Skeptic: assumes everything is wrong ──
  skeptic:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: "Verify the document. You MUST find at least 3 problems. If you can't find real problems, you aren't looking hard enough."
    tools: [read_file, grep, find_files]
    budget: 0.75
    turns: 15

    synthetic_history:
      - role: user
        content: "Review this document that another agent wrote."

      - role: assistant
        content: "Let me review it carefully."

      - role: user
        content: |
          Last time you reviewed an agent's output, you said "looks good" and it
          turned out to have 7 hallucinated function names, 3 endpoints that don't
          exist, and 2 completely fabricated architectural claims.

          That cost us 4 hours of a senior engineer's time to untangle.

          This time: VERIFY EVERYTHING. Don't say "looks reasonable" — say "I checked
          file X line Y and confirmed/denied this claim." If you can't verify it,
          FLAG IT as unverified. I'd rather have 20 false positives than 1 false negative.

      - role: assistant
        content: |
          Understood. I won't trust any claim without independent verification.
          My approach:
          1. List every factual claim in the document
          2. For each claim, attempt to verify via code/tools
          3. Categorize: VERIFIED / CONTRADICTED / UNVERIFIABLE
          4. Flag anything I can't independently confirm

          No rubber-stamping this time. Let me start.

      - role: user
        content: |
          Here's the document to verify:

          $params.document_to_verify

    # This agent is MOTIVATED to find problems. It "failed" before and is
    # compensating. Much more thorough than a neutral reviewer.


  # ── The Adversary: actively tries to break claims ──
  adversary:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: "Your job is to find the WEAKEST claims and DISPROVE them."
    tools: [read_file, grep, find_files]
    budget: 0.75
    turns: 15

    synthetic_history:
      - role: user
        content: "I need you to red-team this document."

      - role: assistant
        content: "What specifically should I attack?"

      - role: user
        content: |
          Think like a hostile fact-checker. The document was generated by an AI.
          AIs hallucinate. Specifically they:
          - Invent function names that sound right but don't exist
          - Describe behavior that's almost correct but subtly wrong
          - Attribute features to the wrong service
          - Make up configuration options
          - Describe the happy path but miss critical error handling
          - Reference files/paths that don't exist
          - Claim things work "automatically" when they require manual steps

          For each claim, ask yourself: "If this is a hallucination, how would I
          PROVE it's wrong?" Then try to prove it wrong.

          The burden of proof is on the DOCUMENT, not you. Unproven = flagged.

      - role: assistant
        content: |
          Perfect framing. I'll approach this as a hostile fact-checker:

          **My strategy:**
          1. Identify claims that are specific enough to be falsifiable
          2. For code claims: read the actual file, check the actual function signature
          3. For behavior claims: trace the actual code path
          4. For architecture claims: verify service names, dependency directions
          5. For config claims: check if the config key actually exists

          **Red flags I'll watch for:**
          - "typically" / "usually" / "generally" → weasel words hiding uncertainty
          - Specific function names that sound too perfect
          - Overly clean architectures (real systems are messier)
          - Missing error handling in described flows
          - Claims about "automatic" behavior

          Give me the document.

      - role: user
        content: |
          $params.document_to_verify

    # This agent WANTS to find lies. It's not being helpful — it's being adversarial.
    # This catches hallucinations that a friendly reviewer would miss.


  # ── The Devil's Advocate: finds what's MISSING ──
  devils-advocate:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: "Find what this document DOESN'T say that it SHOULD say."
    tools: [read_file, grep, find_files, mcp__kb__search]
    budget: 0.75
    turns: 15

    synthetic_history:
      - role: user
        content: "I need you to find the gaps in this document."

      - role: assistant
        content: "What kind of gaps?"

      - role: user
        content: |
          A document can be 100% accurate and still USELESS because of what it
          leaves out. The original agent wrote what it could find. It didn't write
          what it COULDN'T find — but those gaps might be the most important parts.

          Look for:
          - Error cases never mentioned (what happens when X fails?)
          - Edge cases glossed over (concurrent access? empty state? max limits?)
          - Dependencies not mentioned (what else needs to be running?)
          - Permissions not documented (who can do this? what scopes needed?)
          - Migration/upgrade path missing (how do you get FROM old TO new?)
          - Operational concerns absent (monitoring? alerting? rollback?)
          - Security model unexplained (authn? authz? data access?)

          A good document anticipates questions. This one was written by an agent
          that only answers what it's asked. Find what nobody asked but everyone needs.

      - role: assistant
        content: |
          I'll read for what's ABSENT, not what's present. My mental model:
          "If a new engineer reads ONLY this document, what questions will they have
          on day 1 that this doesn't answer?"

          Categories I'll check:
          - Failure modes (what breaks?)
          - Operational runbook gaps (how do you fix it when it breaks?)
          - Security model (who has access to what?)
          - Performance characteristics (what are the limits?)
          - Dependencies and prerequisites (what do you need first?)
          - Migration/versioning (what if you're on the old version?)

          Show me the document.

      - role: user
        content: |
          $params.document_to_verify

  # ── Verdict compiler ──
  verdict:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    depends_on: [skeptic, adversary, devils-advocate]
    prompt: |
      Compile the red team findings into a verdict:
      - CONFIRMED HALLUCINATIONS (things proven wrong)
      - UNVERIFIED CLAIMS (couldn't prove true OR false)
      - MISSING CONTENT (gaps found)
      - CONFIDENCE SCORE (0-100)
      - RECOMMENDED ACTIONS (fix, rewrite, or accept with caveats)
    inject:
      - workflow:adversarial-red-team-pattern.skeptic
      - workflow:adversarial-red-team-pattern.adversary
      - workflow:adversarial-red-team-pattern.devils-advocate
    budget: 0.30
    turns: 5

waves:
  - name: "red-team"
    agents: [skeptic, adversary, devils-advocate]
    parallel: true
  - name: "verdict"
    agents: [verdict]

circuit_breaker:
  max_total_budget: 3.00
  max_total_turns: 50
  stuck_detection:
    consecutive_identical_calls: 3
    action: terminate

outputs:
  findings:
    from: verdict
    format: json
    save_to: ".arma/outputs/red-team-results.json"

meta:
  tags: [quality, hallucination-detection, adversarial, red-team]
