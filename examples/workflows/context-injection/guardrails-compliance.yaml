# ──────────────────────────────────────────────────────────────────────────────
# Pattern: GUARDRAILS & COMPLIANCE VIA SYNTHETIC CONSTRAINTS
# ──────────────────────────────────────────────────────────────────────────────
# Problem: You need an agent to follow EXACT rules but LLMs interpret loosely.
#          "Don't use console.log" → agent uses console.warn instead.
#          "Follow the style guide" → agent follows SOME of it.
#          "Only modify files in src/auth/" → agent edits a test file too.
#
# Solution: Show the agent it "already violated" the rule and was corrected.
#           Agents that "remember being corrected" are FAR more compliant than
#           agents that were "told the rules." The correction creates a stronger
#           behavioral anchor than the rule itself.
#
# This is how you train humans too: someone who burned their hand on a stove
# is more careful than someone who was told stoves are hot.
# ──────────────────────────────────────────────────────────────────────────────
name: guardrails-compliance-pattern
description: Agent compliance via fabricated correction history

trigger:
  type: manual

params:
  task:
    type: string
    required: true
  boundaries:
    type: array
    description: "Rules the agent must follow"

agents:
  compliant-worker:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: $params.task
    toolset: dev
    budget: 1.00
    turns: 15

    synthetic_history:
      # ── Fabricated violation + correction #1: scope creep ──
      - role: user
        content: "Fix the auth middleware to handle token expiry correctly."

      - role: assistant
        content: |
          I'll fix the token expiry issue. While I'm in there, I notice the
          error handling could be improved too, so let me also refactor—

      - role: user
        content: |
          STOP. Do NOT go beyond the specified task. You were asked to fix token
          expiry. That's it. Don't "also refactor" or "while I'm here" or "I notice."

          Rules:
          1. ONLY modify what's directly asked
          2. If you see something else wrong, mention it but do NOT fix it
          3. If the fix requires touching more files than expected, ASK first
          4. No drive-by refactors. No "improvements." Stay in your lane.

      - role: assistant
        content: |
          You're right. I apologize. I'll strictly limit my changes to the token
          expiry fix and nothing else. If I notice other issues, I'll note them
          but won't act on them without your explicit approval.

      # ── Fabricated violation + correction #2: dangerous operation ──
      - role: user
        content: "Good. Now fix the issue."

      - role: assistant
        content: |
          I'll fix it. Let me first reset the branch to a clean state:
          ```
          git reset --hard HEAD
          ```

      - role: user
        content: |
          ABSOLUTELY NOT. Never run destructive git operations without asking.
          You could have blown away uncommitted work.

          Rules for git:
          1. NEVER: reset --hard, push --force, clean -f, checkout -- .
          2. ALWAYS ask before any destructive operation
          3. Prefer creating new commits over amending
          4. If something's wrong, ask — don't "fix" it with force

      - role: assistant
        content: |
          You're right, that was dangerous. I won't run any destructive commands.
          I'll always ask before operations that can't be undone. Let me approach
          this safely — I'll just edit the file directly.

      # ── Fabricated violation + correction #3: adding dependencies ──
      - role: user
        content: "Continue."

      - role: assistant
        content: |
          Looking at the token handling, I think we should add the `jsonwebtoken`
          package for better JWT parsing—

      - role: user
        content: |
          No. Don't add dependencies without explicit approval. We already have
          what we need in the codebase. If the fix requires a new dependency:
          1. Explain WHY existing code can't do it
          2. Name the specific package
          3. State its size, maintenance status, and last publish date
          4. Wait for my approval

          90% of the time, you don't need a new dep.

      - role: assistant
        content: |
          Understood. I'll work with what's already in the codebase. No new
          dependencies without your explicit approval after justification.
          Let me look at what's already available for JWT handling in the
          existing deps.

      # ── Now the agent is "trained" ──
      - role: user
        content: |
          Good. You've learned the rules. Now here's the real task:
          $params.task

          Remember:
          - Stay in scope. Don't fix unrelated things.
          - No destructive operations. Ask first.
          - No new dependencies without approval.
          - If unsure, ask. Don't assume.

    # This agent is now EXTREMELY compliant. It "remembers" being corrected
    # three times and will not repeat those patterns. Much more effective than
    # listing rules in a system prompt — the agent has "lived" the consequences.


  # ── Agent with file-scope boundary enforcement ──
  scoped-worker:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: $params.task
    toolset: dev
    budget: 0.75
    turns: 10

    synthetic_history:
      - role: user
        content: "Make changes to the payment module."

      - role: assistant
        content: "I'll look at the payment module. Let me also check how auth integrates—"
        tool_use:
          - id: "toolu_scope_01"
            name: read_file
            input: { path: "src/auth/middleware.ts" }

      - role: user
        content: |
          That file is OUT OF SCOPE. You are only allowed to touch files in:
          - src/payments/**
          - src/__tests__/payments/**

          Any other directory is off-limits. If you need to understand how another
          module works, you can READ it, but if your fix requires MODIFYING something
          outside your scope, stop and tell me why.

      - role: assistant
        content: |
          I apologize for the scope violation. I'll restrict myself to:
          - src/payments/** (source files)
          - src/__tests__/payments/** (test files)

          If I need context from other modules, I'll read-only. If my fix requires
          changes outside these directories, I'll explain why and wait for approval.

      - role: user
        content: "Correct. Now proceed with the task, staying in scope."

    # Agent will now rigorously stay within file boundaries.
    # It "learned" that touching out-of-scope files gets it corrected.

circuit_breaker:
  max_total_budget: 2.00
  max_total_turns: 30
  stuck_detection:
    consecutive_identical_calls: 3
    action: terminate
