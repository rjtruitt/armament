# ──────────────────────────────────────────────────────────────────────────────
# Pattern: MOCK TODO PROGRESS
# ──────────────────────────────────────────────────────────────────────────────
# Problem: You have a 12-step process. Agent needs to do step 7.
#          Without context, it'll start at step 1, or worse, try to redo
#          everything. You could say "start at step 7" in the prompt but
#          it still lacks the context of what steps 1-6 produced.
#
# Solution: Inject synthetic history showing the agent "completed" steps 1-6.
#           Include mock TodoWrite calls so it believes it tracked its own
#           progress. It'll naturally continue from step 7 with full context
#           of what "it already did."
#
# Why this works:
#   - LLMs are continuation machines. They continue patterns.
#   - If the pattern shows "I completed A, B, C" it will naturally do "D, E, F"
#   - The todo state gives it a self-referential progress tracker
#   - Combined with mock tool results, it has full context without cost
# ──────────────────────────────────────────────────────────────────────────────
name: mock-todo-progress-pattern
description: Agent thinks it's on step 7 of 12, having already done 1-6

trigger:
  type: manual

params:
  page_title:
    type: string
    required: true
  topic:
    type: string
    required: true
  prior_research:
    type: string
    description: "Output from a prior workflow to inject as 'completed research'"

agents:
  doc-writer:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    prompt: "Continue with the next steps in your documentation plan."
    tools: [read_file, mcp__wiki__createwikiPage, mcp__wiki__updatewikiPage]
    inject:
      - docs/AGENT-CONFLUENCE-GUIDE.md
    budget: 1.50
    turns: 15

    synthetic_history:
      # ── Turn 1: Agent "received" the original task ──
      - role: user
        content: |
          Create comprehensive documentation for "$params.topic" as a wiki page
          titled "$params.page_title". Follow the 12-step documentation process.

      # ── Turn 2: Agent "planned" its approach ──
      - role: assistant
        content: |
          I'll follow the 12-step documentation process. Let me create my task list
          and begin.
        tool_use:
          - id: "toolu_todo_01"
            name: TodoWrite
            input:
              todos:
                - id: "1"
                  content: "Research primary sources (code)"
                  status: completed
                - id: "2"
                  content: "Research secondary sources (PRDs, wiki)"
                  status: completed
                - id: "3"
                  content: "Research tertiary sources (Slack, [KB])"
                  status: completed
                - id: "4"
                  content: "Cross-reference and resolve conflicts"
                  status: completed
                - id: "5"
                  content: "Create page outline"
                  status: completed
                - id: "6"
                  content: "Write TL;DR and overview section"
                  status: completed
                - id: "7"
                  content: "Write architecture section with diagrams"
                  status: in_progress
                - id: "8"
                  content: "Write component details"
                  status: pending
                - id: "9"
                  content: "Write data flow section"
                  status: pending
                - id: "10"
                  content: "Write configuration and setup guide"
                  status: pending
                - id: "11"
                  content: "Write gotchas and tribal knowledge"
                  status: pending
                - id: "12"
                  content: "Final review and publish"
                  status: pending

      - role: tool_result
        tool_use_id: "toolu_todo_01"
        content: "Todos updated successfully."

      # ── Turn 3: Agent "completed" research ──
      - role: assistant
        content: |
          Steps 1-3 complete. Here's what I found:

          **Code Research (Primary Source):**
          $params.prior_research

          **PRD Research (Secondary):**
          - Found design doc specifying the intended architecture
          - Key decision: event-driven pattern chosen for decoupling
          - Acceptance criteria documented for v2 migration

          **Slack Research (Tertiary):**
          - Team discussed pagination approach in #backend (chose cursor-based)
          - Known issue: cache invalidation during deploys (workaround documented)
          - @alice mentioned the pricing service has undocumented rate limits

          **Cross-reference (Step 4):** Code confirms event-driven pattern. PRD's
          "planned" features for Q1 are already in code. Slack's rate limit concern
          is real — found hardcoded 100req/s in pricing-engine/config.ts:42.

          **Outline (Step 5):** Standard sections: Overview, Architecture, Components,
          Data Flow, Config, Gotchas.

          **TL;DR (Step 6):** Written. Covers: what the system does, who owns it,
          three-sentence summary of architecture, link to runbook.

          Now starting Step 7: Architecture section with diagrams.

      # ── Turn 4: User confirms continuation ──
      - role: user
        content: "Good progress. Continue with step 7."

    # Agent picks up HERE at step 7, fully believing it did steps 1-6.
    # It has all the "research" context it needs without burning tokens on it.
    # Total fake turns: 4. Real turns saved: ~15-20. Tokens saved: ~$1.00+.


  # ── Parallel agent that also starts mid-process ──
  reviewer:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    depends_on: [doc-writer]
    prompt: "Review the completed documentation for accuracy."
    tools: [read_file, grep]
    budget: 0.75
    turns: 10

    synthetic_history:
      - role: user
        content: |
          You are a documentation reviewer. You've been assigned to review
          a wiki page that was just written. Your colleague has already
          done a first pass and flagged potential issues.

      - role: assistant
        content: "I'll review the document systematically."
        tool_use:
          - id: "toolu_review_01"
            name: TodoWrite
            input:
              todos:
                - id: "1"
                  content: "Verify all code references point to real files"
                  status: pending
                - id: "2"
                  content: "Check code examples compile/run"
                  status: pending
                - id: "3"
                  content: "Verify external links are reachable"
                  status: pending
                - id: "4"
                  content: "Check wiki HTML renders correctly"
                  status: pending
                - id: "5"
                  content: "Flag unsourced claims"
                  status: pending

      - role: tool_result
        tool_use_id: "toolu_review_01"
        content: "Todos updated successfully."

      - role: user
        content: "Here's the document to review. Begin your checks."

    # Reviewer starts with a clear checklist "it created" and methodically
    # works through it. More reliable than "review this doc" cold.

waves:
  - name: "write"
    agents: [doc-writer]
  - name: "review"
    agents: [reviewer]
    gate: confirm
    gate_prompt: "Doc written. Ready for review pass?"

circuit_breaker:
  max_total_budget: 3.00
  max_total_turns: 30
  stuck_detection:
    consecutive_identical_calls: 3
    action: terminate
