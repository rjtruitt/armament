# ──────────────────────────────────────────────────────────────────────────────
# Nightly Standup — chains three workflows: collect, analyze, report
# Each workflow feeds into the next via context references
# ──────────────────────────────────────────────────────────────────────────────
name: nightly-standup
description: "Collect daily activity → analyze progress → generate standup notes"
version: "1.0.0"

trigger:
  type: cron
  cron: "0 22 * * 1-5"  # 10 PM weekdays

params:
  team:
    type: string
    default: "engineering"
  report_channel:
    type: string
    default: "#standup-notes"

agents:
  # ── Collector: pull from all sources ──
  git-collector:
    provider: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001
    prompt: |
      Collect today's git activity for team $params.team:
      - All commits pushed today
      - PRs opened, merged, or closed
      - Branches created

      Group by author. Output structured JSON.
    tools: [mcp__github__list_commits, mcp__github__list_pull_requests, mcp__github__list_branches]
    output: git_activity
    budget: 0.10
    turns: 10

  jira-collector:
    provider: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001
    prompt: |
      Collect today's Jira activity:
      - Tickets moved to "In Progress" or "Done"
      - New tickets created
      - Blockers flagged
      - Sprint burndown status

      Output structured JSON with ticket IDs and summaries.
    tools: [mcp__wiki__searchJiraIssuesUsingJql]
    output: jira_activity
    budget: 0.10
    turns: 8

  slack-collector:
    provider: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001
    prompt: |
      Collect notable Slack discussions from today:
      - Decisions made in engineering channels
      - Questions asked that indicate blockers
      - Knowledge shared (links, explanations)

      Skip chitchat. Only capture work-relevant messages.
    tools: [mcp__kb__search]
    output: slack_activity
    budget: 0.10
    turns: 8

  # ── Analyzer: cross-reference and find patterns ──
  analyzer:
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6-v1
    depends_on: [git-collector, jira-collector, slack-collector]
    prompt: |
      Cross-reference today's activity:
      - Which Jira tickets had matching git commits? (progress confirmed)
      - Which tickets had NO git activity? (potential blockers)
      - Which git work has NO Jira ticket? (untracked work)
      - What discussions suggest upcoming risks or delays?

      Identify: wins, risks, blockers, untracked work.
    inject:
      - workflow:nightly-standup.git-collector
      - workflow:nightly-standup.jira-collector
      - workflow:nightly-standup.slack-collector
    output: analysis
    budget: 0.25
    turns: 8

  # ── Reporter: generate human-readable standup ──
  reporter:
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6-v1
    depends_on: [analyzer]
    prompt: |
      Generate tomorrow's standup notes for $params.team:

      Format:
      **Done Today:**
      - bullet per completed item

      **In Progress:**
      - bullet per active item with % estimate

      **Blockers:**
      - bullet per blocker with who's affected

      **Heads Up:**
      - risks or things the team should know

      Keep it scannable. No fluff. Link Jira tickets.
    inject:
      - workflow:nightly-standup.analyzer
      - workflow:nightly-standup.git-collector
      - workflow:nightly-standup.jira-collector
    output: standup_notes
    budget: 0.15
    turns: 5

waves:
  - name: "collect"
    agents: [git-collector, jira-collector, slack-collector]
    parallel: true
  - name: "analyze"
    agents: [analyzer]
  - name: "report"
    agents: [reporter]

circuit_breaker:
  max_total_budget: 1.00
  max_total_turns: 50
  stuck_detection:
    consecutive_identical_calls: 2
    action: terminate

outputs:
  notes:
    from: reporter
    format: markdown
    save_to: ".arma/outputs/standup-$date.md"
    publish_to: channel:$params.report_channel

hooks:
  on_complete: "/log 'Standup notes generated for $date'"

meta:
  tags: [chaining, daily, standup, automated]
