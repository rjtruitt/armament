# ──────────────────────────────────────────────────────────────────────────────
# Competitive Analysis — research competitors, synthesize into brief
# ──────────────────────────────────────────────────────────────────────────────
name: competitive-analysis
description: Research competitors and generate analysis brief
version: "1.0.0"

trigger:
  type: manual

params:
  product:
    type: string
    required: true
    description: "Your product/feature to compare"
  competitors:
    type: array
    required: true
    description: "List of competitor names/products"
  focus_areas:
    type: array
    default: ["pricing", "features", "UX", "market positioning"]

agents:
  researcher-pool:
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6-v1
    prompt: |
      Research $params.competitors as competitors to $params.product.
      For each competitor, find:
      - Key features and differentiators
      - Pricing model
      - Target audience
      - Recent changes/announcements
      - Strengths and weaknesses

      Focus on: $params.focus_areas

      Search [KB] for any internal competitive intelligence we already have.
    tools: [mcp__kb__search, mcp__kb__chat]
    output: research
    budget: 1.00
    turns: 25
    timeout: 180000

  analyst:
    provider: anthropic
    model: claude-sonnet-4-6-20250514
    depends_on: [researcher-pool]
    prompt: |
      Create a competitive analysis brief from the research.

      Structure:
      1. Executive Summary (3 bullets)
      2. Feature Comparison Matrix (table)
      3. Pricing Comparison
      4. Our Advantages
      5. Our Gaps
      6. Recommendations (prioritized)

      Be honest about gaps. This is internal — we need truth, not spin.
    inject:
      - workflow:competitive-analysis.researcher-pool
    output: analysis
    budget: 0.50
    turns: 5

  formatter:
    provider: bedrock
    model: us.anthropic.claude-haiku-4-5-20251001
    depends_on: [analyst]
    prompt: |
      Format the competitive analysis as a wiki page.
      Use proper HTML: expand macros for details, tables for comparisons,
      status macros for our position (green=ahead, yellow=parity, red=behind).
    inject:
      - workflow:competitive-analysis.analyst
      - docs/AGENT-CONFLUENCE-GUIDE.md
    output: formatted_page
    budget: 0.15
    turns: 3

circuit_breaker:
  max_total_budget: 2.00
  max_total_turns: 40
  stuck_detection:
    consecutive_identical_calls: 3
    action: terminate

outputs:
  brief:
    from: formatted_page
    format: markdown
    save_to: ".arma/outputs/competitive-$params.product.md"

meta:
  tags: [research, strategy, competitive]
